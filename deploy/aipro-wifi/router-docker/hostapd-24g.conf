# aipro AP — 2.4G 版（aipro-wifi 24ch 切换用）
# 穿墙覆盖优先（速度低于 5G；USB2 下差异不大，见 deploy README 分析）
interface=wlan1
driver=nl80211
ssid=aipro
hw_mode=g
channel=1
ieee80211n=1
ht_capab=[SHORT-GI-20][SHORT-GI-40]
wmm_enabled=1

wpa=2
wpa_passphrase=xYuan666666
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
max_num_sta=10
ignore_broadcast_ssid=1
