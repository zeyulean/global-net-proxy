# aipro 5G AP（wlan1 = 绿联 AX900 / AIC8800D80，WiFi6）
interface=wlan1
driver=nl80211
ssid=aipro
hw_mode=a
channel=36
ieee80211ac=1
# 尝试 WiFi6（驱动支持则生效，不支持 hostapd 会忽略）
ieee80211ax=1
wmm_enabled=1
# 80MHz (ch36-48)
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42

wpa=2
wpa_passphrase=xYuan666666
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
max_num_sta=10
ignore_broadcast_ssid=0
